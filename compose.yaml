services:
  server:
    image: ghcr.io/ferecece/speedrunlatam:latest
    build:
      context: ./docker
      dockerfile: Dockerfile
    environment:
      STARTUP: ./mta-server64 --port ${SERVER_PORT:-22003} --httpport ${SERVER_HTTP_PORT:-22005} -n
      SERVER_MEMORY: ${SERVER_MEMORY:-4096}
      SERVER_MAXPLAYERS: ${SERVER_MAXPLAYERS:-70}
      SERVER_FPSLIMIT: ${SERVER_FPSLIMIT:-300}
      SERVER_NAME: ${SERVER_NAME:-Speedrun LATAM}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      HTTP_DOWNLOAD_URL: ${HTTP_DOWNLOAD_URL:-}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    ports:
      - "${SERVER_PORT:-22003}:${SERVER_PORT:-22003}/udp"
      - "${SERVER_PORT:-22003}:${SERVER_PORT:-22003}/tcp"
      - "${SERVER_HTTP_PORT:-22005}:${SERVER_HTTP_PORT:-22005}/tcp"
    volumes:
      - ./server:/home/container
    user: "${PUID:-1000}:${PGID:-1000}"
    stop_grace_period: 30s
    restart: unless-stopped
