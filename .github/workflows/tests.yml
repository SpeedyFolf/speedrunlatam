name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shell syntax
        run: |
          bash -n docker/entrypoint.sh
          bash -n docker/install-server.sh

      - name: Python tests
        run: python3 -m unittest discover -s tests -t . -p 'test_*.py' -v
