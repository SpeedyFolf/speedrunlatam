name: cd-manual

on:
  workflow_dispatch:
    inputs:
      action:
        description: Operation to run
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - deploy
          - rollback
      tag:
        description: Release tag (required for deploy; optional for rollback)
        required: false
        type: string
      allow_reinstall:
        description: Allow a Pterodactyl Reinstall if the release changed docker/**
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: API endpoint diagnostic
        if: inputs.action == 'preflight'
        env:
          PTERODACTYL_URL: ${{ secrets.PTERODACTYL_URL }}
        run: |
          python3 - <<'PY'
          import os
          import socket
          import ssl
          import urllib.parse

          url = os.environ.get("PTERODACTYL_URL", "")
          parsed = urllib.parse.urlparse(url)
          host = parsed.hostname
          port = parsed.port or (443 if parsed.scheme == "https" else 80)
          print(f"scheme={parsed.scheme} port={port} host_len={len(host or '')}")
          try:
              infos = socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)
          except Exception as exc:
              print("dns_error", type(exc).__name__, str(exc)[:200])
              raise SystemExit(0)
          ips = sorted({info[4][0] for info in infos})
          print("resolved_ips", ips)
          for ip in ips:
              print("trying", ip)
              try:
                  sock = socket.create_connection((ip, port), timeout=10)
                  print("tcp_ok", ip)
                  if parsed.scheme == "https":
                      context = ssl.create_default_context()
                      tls = context.wrap_socket(sock, server_hostname=host)
                      print("tls_ok", ip, tls.version())
                      tls.close()
                  else:
                      sock.close()
              except Exception as exc:
                  print("connect_error", ip, type(exc).__name__, str(exc)[:200])
          PY

      - name: Run deploy tool
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PTERODACTYL_URL: ${{ secrets.PTERODACTYL_URL }}
          PTERODACTYL_API_KEY: ${{ secrets.PTERODACTYL_API_KEY }}
          PTERODACTYL_SERVER_ID: ${{ secrets.PTERODACTYL_SERVER_ID }}
          DEPLOY_ANNOUNCE: ${{ vars.CD_ANNOUNCE || '0' }}
          DEPLOY_DELAY_GAMEMODE: ${{ vars.CD_DELAY_GAMEMODE || '30' }}
          DEPLOY_DELAY_RESOURCE: ${{ vars.CD_DELAY_RESOURCE || '10' }}
          DEPLOY_DELAY_RESTART: ${{ vars.CD_DELAY_RESTART || '30' }}
        run: |
          ARGS=(--action "${{ inputs.action }}")
          if [ -n "${{ inputs.tag }}" ]; then
            ARGS+=(--tag "${{ inputs.tag }}")
          fi
          if [ "${{ inputs.allow_reinstall }}" = "true" ]; then
            ARGS+=(--allow-reinstall)
          fi
          ARGS+=(--auto-rollback)
          python3 scripts/deploy.py "${ARGS[@]}"
