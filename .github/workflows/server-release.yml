name: server-template

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v1.6.0
        required: true
        type: string
      previous_tag:
        description: Deployed tag to diff from (empty = latest reachable tag)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record tag
        id: vars
        run: echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        run: |
          PREVIOUS="${{ inputs.previous_tag }}"
          if [ -z "$PREVIOUS" ]; then
            PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' "${RELEASE_TAG}^" 2>/dev/null || true)
          fi
          echo "building $RELEASE_TAG from ${PREVIOUS:-<none>}"
          python3 scripts/build-release.py \
            --tag "$RELEASE_TAG" \
            --previous-tag "$PREVIOUS" \
            --repo "$GITHUB_REPOSITORY" \
            --out dist

      - name: Summarize release manifest
        id: manifest
        run: |
          python3 - <<'PY'
          import json
          import os

          manifest = json.load(open("dist/update.json", encoding="utf-8"))
          docker = bool(manifest.get("docker_changed"))
          changes = manifest.get("changes") or {}
          docker_files = sorted(
              path
              for key in ("modified", "added", "deleted")
              for path in (changes.get(key) or [])
              if path == "docker" or path.startswith("docker/") or path == ".github/workflows/docker.yml"
          )
          lines = [
              f"previous_tag: `{manifest.get('previous_tag')}`",
              f"mode: `{manifest.get('mode')}`",
              f"docker_changed: `{docker}`",
          ]
          if docker_files:
              lines.append("docker files:")
              lines.extend(f"- `{path}`" for path in docker_files)
          text = "\n".join(lines) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("## Release manifest\n" + text)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"docker_changed={str(docker).lower()}\n")
          PY

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: dist/update.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true

  deploy:
    needs: build
    if: vars.CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main; refusing to deploy."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: dist

      - name: Read release manifest
        id: manifest
        run: |
          python3 - <<'PY'
          import json
          import os

          manifest = json.load(open("dist/update.json", encoding="utf-8"))
          docker = bool(manifest.get("docker_changed"))
          changes = manifest.get("changes") or {}
          docker_files = sorted(
              path
              for key in ("modified", "added", "deleted")
              for path in (changes.get(key) or [])
              if path == "docker" or path.startswith("docker/") or path == ".github/workflows/docker.yml"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"docker_changed={str(docker).lower()}\n")
          with open("/tmp/docker-files.txt", "w", encoding="utf-8") as handle:
              handle.write("\n".join(docker_files))
          PY

      - name: Explain image requirement
        if: steps.manifest.outputs.docker_changed == 'true'
        run: |
          {
            echo "## This release includes docker/** changes"
            echo
            echo 'The running container image must be updated before a hot deploy:'
            echo '1. Wait for the `docker` workflow to publish `ghcr.io/ferecece/speedrunlatam:latest`.'
            echo '2. Reinstall the server in Pterodactyl.'
            echo '3. Rerun this workflow (or `cd-manual deploy`) with `allow_image_current=true` / `CD_IMAGE_CURRENT=true`.'
            echo
            echo '```text'
            cat /tmp/docker-files.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deploy through the panel API
        env:
          PTERODACTYL_URL: ${{ secrets.PTERODACTYL_URL }}
          PTERODACTYL_API_KEY: ${{ secrets.PTERODACTYL_API_KEY }}
          PTERODACTYL_SERVER_ID: ${{ secrets.PTERODACTYL_SERVER_ID }}
          DEPLOY_ANNOUNCE: ${{ vars.CD_ANNOUNCE || '0' }}
          DEPLOY_DELAY_GAMEMODE: ${{ vars.CD_DELAY_GAMEMODE || '30' }}
          DEPLOY_DELAY_RESOURCE: ${{ vars.CD_DELAY_RESOURCE || '10' }}
          DEPLOY_DELAY_RESTART: ${{ vars.CD_DELAY_RESTART || '30' }}
          ALLOW_IMAGE_CURRENT: ${{ vars.CD_IMAGE_CURRENT || 'false' }}
        run: |
          set +e
          ARGS=(--tag "${{ needs.build.outputs.tag }}" --manifest dist/update.json --auto-rollback)
          if [ "$ALLOW_IMAGE_CURRENT" = "true" ]; then
            ARGS+=(--allow-image-current)
          fi
          python3 scripts/deploy.py "${ARGS[@]}" 2>&1 | tee /tmp/deploy.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "## CD deploy failed"
              echo '```text'
              tail -30 /tmp/deploy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: Publish deploy error as a commit status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          try:
              lines = open("/tmp/deploy.log", encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              lines = []
          message = " ".join(line.strip() for line in lines[-4:])[:120] or "deploy step failed"
          payload = json.dumps({
              "state": "failure",
              "context": "cd-deploy-error",
              "description": message,
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.status)
          PY
