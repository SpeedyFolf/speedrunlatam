name: Enviar un mapa
description: Proponer un mapa nuevo para el servidor.
title: "[Mapa] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Adjunta el `.zip` del resource (arrástralo en el campo de archivo) y elige el tipo.
        Antes de enviar, prueba el mapa con **Test** del editor.
        Guía: [docs/contributing.md](https://github.com/ferecece/speedrunlatam/blob/main/docs/contributing.md)

  - type: textarea
    id: archivo
    attributes:
      label: Archivo del mapa
      description: Arrastra el `.zip` del resource aquí. También sirve un link.
      placeholder: MiMapa.zip con meta.xml, .map y scripts.
    validations:
      required: true

  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de mapa
      description: Debe coincidir con el `racetype` del `meta.xml`.
      options:
        - R (carrera normal)
        - F2F (cara a cara)
        - SR (misión de GTA en modo race)
        - RANDOM (randomizer de vehículo)
    validations:
      required: true

  - type: textarea
    id: capturas
    attributes:
      label: Capturas
      description: Opcional. Una imagen del mapa o del recorrido ayuda a revisarlo.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Confirmo que el mapa fue creado con el editor según la guía y no otro.
          required: true
        - label: Probé el mapa con **Test** del editor.
          required: true
